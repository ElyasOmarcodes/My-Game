plugins {
    id 'com.android.application'
}

android {
    namespace 'com.elyasomar.battleofagents'
    compileSdk 34

    defaultConfig {
        applicationId "com.elyasomar.battleofagents"
        minSdk 24
        targetSdk 34
        versionCode project.hasProperty('boaBuildNumber') ? boaBuildNumber.toInteger() : 1
        versionName project.hasProperty('boaVersion') ? boaVersion : "0.1.0"
    }

    buildTypes {
        debug {
            // Debug signing on purpose: the APK installs on any phone with
            // "install unknown apps" enabled and nobody has to manage a key.
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Signed with the debug key so a release-shrunk build is still installable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources.excludes += ['META-INF/*.version', 'META-INF/*.kotlin_module',
                               'DebugProbesKt.bin', 'kotlin/**']
    }

    // The web engine lives at the repo root and is shared with the screenshot
    // tooling, so it is copied in at build time instead of being duplicated here.
    sourceSets {
        main {
            assets.srcDirs += "${rootProject.projectDir}/../engine-assets"
        }
    }
}

tasks.register('copyEngine', Copy) {
    from("${rootProject.projectDir}/../engine") {
        exclude 'shots.html', 'js/shots.js'
    }
    into "${rootProject.projectDir}/../engine-assets/game"
}

tasks.named('preBuild') { dependsOn 'copyEngine' }

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
