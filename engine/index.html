<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Battle of Agents</title>
<style>
  :root {
    --void: #05070C; --surface: #0B1119; --line: #1E2C3C;
    --cyan: #3BE8FF; --amber: #FFB23B; --danger: #FF4D5E; --success: #4DFFA6;
    --text-hi: #E8F4FF; --text-mid: #93A6BC; --text-low: #55677D;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--void);
    font-family: "Roboto Condensed", "DejaVu Sans", system-ui, Arial, sans-serif;
    color: var(--text-hi); user-select: none; -webkit-user-select: none; }
  #view { display: block; position: fixed; inset: 0; touch-action: none; }

  .hud { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  .cap { font-size: 12px; font-weight: 700; letter-spacing: .22em;
    text-transform: uppercase; color: var(--text-low); }

  /* vitals, bottom left */
  #vitals { position: absolute; left: 22px; bottom: 22px; width: 250px; }
  #agentName { font-size: 17px; font-weight: 700; letter-spacing: .16em; color: var(--cyan); }
  #health { font-size: 34px; font-weight: 700; line-height: 1.1; }
  .bar { height: 6px; background: rgba(5,7,12,.85); margin-top: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--success); width: 100%; }

  /* ammo, bottom right of centre */
  #ammoBox { position: absolute; right: 300px; bottom: 26px; text-align: right; }
  #ammo { font-size: 30px; font-weight: 700; }
  #weaponName { font-size: 12px; letter-spacing: .18em; color: var(--text-low); font-weight: 700; }

  /* crosshair */
  #cross { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 4px; height: 4px; background: var(--cyan); box-shadow: 0 0 8px var(--cyan); }
  #cross::before, #cross::after { content: ""; position: absolute; background: rgba(59,232,255,.75); }
  #cross::before { left: 1px; top: -16px; width: 2px; height: 10px; box-shadow: 0 24px rgba(59,232,255,.75); }
  #cross::after { top: 1px; left: -16px; height: 2px; width: 10px; box-shadow: 24px 0 rgba(59,232,255,.75); }

  /* touch controls */
  #stick { position: absolute; width: 150px; height: 150px; border-radius: 50%;
    background: rgba(85,103,125,.10); border: 1px solid rgba(85,103,125,.28); display: none; }
  #stickKnob { position: absolute; left: 43px; top: 43px; width: 64px; height: 64px;
    border-radius: 50%; background: rgba(59,232,255,.32); }
  .btn { position: absolute; border-radius: 50%; display: flex; align-items: center;
    justify-content: center; font-size: 13px; font-weight: 700; letter-spacing: .14em; }
  #btn-fire { background: rgba(255,77,94,.16); border: 2px solid rgba(255,77,94,.7); color: var(--danger); }
  #btn-jump { background: rgba(59,232,255,.14); border: 2px solid rgba(59,232,255,.6); color: var(--cyan); }
  #btn-sprint { background: rgba(255,178,59,.14); border: 2px solid rgba(255,178,59,.6); color: var(--amber); }

  /* wifi rooms panel */
  #rooms { position: absolute; right: 20px; top: 20px; width: 260px;
    background: rgba(11,17,25,.78); border: 1px solid var(--line); padding: 14px;
    pointer-events: auto; }
  #rooms h2 { font-size: 12px; font-weight: 700; letter-spacing: .22em; color: var(--text-low);
    text-transform: uppercase; margin-bottom: 8px; }
  #roomList { list-style: none; font-size: 13px; }
  #roomList li { display: flex; justify-content: space-between; gap: 8px; padding: 5px 0;
    border-bottom: 1px solid rgba(30,44,60,.6); }
  #roomList li span { color: var(--text-mid); }
  #roomList li.empty { color: var(--text-low); font-style: italic; border: 0; }
  #hostBtn { margin-top: 10px; width: 100%; padding: 9px; background: rgba(59,232,255,.14);
    border: 1px solid rgba(59,232,255,.8); color: var(--cyan); font-weight: 700;
    letter-spacing: .16em; font-size: 12px; text-transform: uppercase; }

  #banner { position: absolute; left: 50%; top: 16px; transform: translateX(-50%);
    display: none; padding: 8px 18px; background: rgba(77,255,166,.14);
    border: 1px solid rgba(77,255,166,.7); color: var(--success);
    font-size: 13px; font-weight: 700; letter-spacing: .16em; }

  #fps { position: absolute; left: 22px; top: 18px; font-size: 11px; letter-spacing: .12em;
    color: var(--text-low); }
  #title { position: absolute; left: 22px; top: 36px; font-size: 12px; font-weight: 700;
    letter-spacing: .28em; color: rgba(59,232,255,.65); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="hud">
  <div id="fps">—</div>
  <div id="title">BATTLE OF AGENTS</div>
  <div id="cross"></div>

  <div id="vitals">
    <div id="agentName">VANGUARD</div>
    <div id="health">120</div>
    <div class="bar"><i id="healthBar"></i></div>
  </div>

  <div id="ammoBox">
    <div id="ammo">30 / 150</div>
    <div id="weaponName">MK-7 CARBINE</div>
  </div>

  <div id="stick"><div id="stickKnob"></div></div>
  <div class="btn" id="btn-fire" style="pointer-events:auto">FIRE</div>
  <div class="btn" id="btn-jump" style="pointer-events:auto">JUMP</div>
  <div class="btn" id="btn-sprint" style="pointer-events:auto">RUN</div>

  <div id="rooms">
    <h2>Wi-Fi squads</h2>
    <ul id="roomList"><li class="empty">scanning…</li></ul>
    <button id="hostBtn">Host a squad</button>
  </div>

  <div id="banner"></div>
</div>

<script type="module" src="./js/game.js"></script>
</body>
</html>
