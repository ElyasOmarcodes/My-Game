<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Battle of Agents — render</title>
<style>
  html, body { margin: 0; background: #05070C; overflow: hidden; }
  canvas { display: block; }
  .label {
    position: fixed; left: 34px; bottom: 30px; z-index: 5;
    font: 700 22px/1.35 "Roboto Condensed", "DejaVu Sans", Arial, sans-serif;
    letter-spacing: .22em; text-transform: uppercase; color: #E8F4FF;
    text-shadow: 0 2px 20px rgba(0,0,0,.9);
  }
  .label small {
    display: block; margin-top: 6px; font-size: 17px; font-weight: 400;
    letter-spacing: .10em; text-transform: none; color: #93A6BC;
  }
  .tag {
    position: fixed; right: 34px; bottom: 30px; z-index: 5; text-align: right;
    font: 700 17px/1.5 "Roboto Condensed", "DejaVu Sans", Arial, sans-serif;
    letter-spacing: .26em; color: #3BE8FF; text-shadow: 0 2px 18px rgba(0,0,0,.9);
  }
  .caption {
    position: fixed; left: 34px; top: 28px; z-index: 5;
    font: 400 18px/1.7 "DejaVu Sans", Arial, sans-serif; color: #93A6BC;
    text-shadow: 0 2px 18px rgba(0,0,0,.9);
  }
  .caption b { color: #E8F4FF; font-weight: 700; letter-spacing: .04em; }
</style>
</head>
<body>
<canvas id="view"></canvas>
<div class="label" id="label"></div>
<div class="tag">BATTLE OF AGENTS</div>
<div class="caption" id="caption"></div>
<script type="module" src="./js/shots.js"></script>
</body>
</html>
