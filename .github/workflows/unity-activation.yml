name: Unity licence request

# Run this once, by hand, to get the file Unity needs to issue a free personal
# licence for CI. It builds nothing and needs no secrets.
#
#   1. Run this workflow.
#   2. Download the "Unity_alf" artifact and unzip it.
#   3. Go to https://license.unity3d.com/manual, upload the .alf, pick
#      "Unity Personal" and answer the two questions, then download the .ulf.
#   4. Open the .ulf in a text editor, copy everything, and save it as the
#      repository secret UNITY_LICENSE.
#
# game-ci's unity-request-activation-file action was retired, so the activation
# file is produced by running the editor image directly — which is exactly what
# that action used to do.

on:
  workflow_dispatch:
    inputs:
      unity_version:
        description: "Unity version to request the licence for"
        default: "2022.3.62f1"

jobs:
  activation:
    name: Request activation file
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Create the manual activation file
        env:
          UNITY_VERSION: ${{ inputs.unity_version || '2022.3.62f1' }}
        run: |
          set -euo pipefail
          mkdir -p activation

          IMAGE="unityci/editor:ubuntu-${UNITY_VERSION}-base-3"
          if ! docker pull "$IMAGE"; then
            IMAGE="unityci/editor:${UNITY_VERSION}-base-3"
            docker pull "$IMAGE"
          fi

          # The editor always exits non-zero after writing the .alf — that is the
          # documented behaviour, not a failure, so the exit code is ignored and
          # the file itself is what we check.
          docker run --rm -v "$PWD/activation:/opt/activation" -w /opt/activation \
            "$IMAGE" unity-editor -batchmode -nographics -logFile /dev/stdout \
            -createManualActivationFile -quit || true

          sudo chown -R "$USER" activation
          ls -la activation
          if ! ls activation/*.alf >/dev/null 2>&1; then
            echo "::error::Unity did not produce an .alf file"; exit 1
          fi

      - name: Upload .alf
        uses: actions/upload-artifact@v4
        with:
          name: Unity_alf
          path: activation/*.alf
          retention-days: 7

      - name: What to do next
        run: |
          {
            echo "## Next steps"
            echo ""
            echo "1. Download the **Unity_alf** artifact from this run and unzip it."
            echo "2. Upload the \`.alf\` at <https://license.unity3d.com/manual>,"
            echo "   choose **Unity Personal**, and download the \`.ulf\` licence."
            echo "3. Copy the whole \`.ulf\` file contents into a new repository secret"
            echo "   named **UNITY_LICENSE** (Settings ▸ Secrets and variables ▸ Actions)."
            echo "4. Re-run the **Android APK** workflow."
          } >> "$GITHUB_STEP_SUMMARY"
