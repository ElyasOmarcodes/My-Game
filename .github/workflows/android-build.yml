name: Android APK

on:
  workflow_dispatch:
    inputs:
      development_build:
        description: "Development build (profiler + debug symbols)"
        type: boolean
        default: false
  push:
    branches: [ "claude/android-multiplayer-game-st4h00", "main" ]
    tags: [ "v*" ]
    paths-ignore: [ "docs/**", "tools/**", "**/*.md" ]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 2022.3.62f1
  BOA_VERSION: 0.1.0

jobs:
  # Unity refuses to run head-lessly without an activated licence, and the error it
  # prints ("Missing Unity License File") is easy to mistake for a project problem.
  # This gate names the real cause up front and skips the build instead of failing it.
  preflight:
    name: Check Unity licence
    runs-on: ubuntu-latest
    outputs:
      licensed: ${{ steps.check.outputs.licensed }}
    steps:
      - id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -n "$UNITY_LICENSE" ] || [ -n "$UNITY_SERIAL" ]; then
            echo "licensed=true" >> "$GITHUB_OUTPUT"
            echo "✅ Unity licence found — building." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "licensed=false" >> "$GITHUB_OUTPUT"
            {
              echo "## ⏭️ Build skipped — no Unity licence"
              echo ""
              echo "Unity cannot start in batch mode without an activated licence."
              echo "One-time setup:"
              echo ""
              echo "1. Actions ▸ **Unity licence request** ▸ Run workflow."
              echo "2. Download the \`Unity_v2022.x.alf\` artifact from that run."
              echo "3. Upload it at <https://license.unity3d.com/manual> and download the \`.ulf\`."
              echo "4. Settings ▸ Secrets and variables ▸ Actions ▸ New secret:"
              echo "   **\`UNITY_LICENSE\`** = the entire contents of the \`.ulf\` file."
              echo ""
              echo "Then re-run this workflow. Nothing else is needed — the APK is signed"
              echo "with Unity's debug key, so no keystore secrets are required."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  build:
    name: Build APK (IL2CPP · ARM64)
    needs: preflight
    if: needs.preflight.outputs.licensed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0   # unity-builder inspects tags

      # The Unity Android image plus the Library cache does not fit next to the
      # runner's preinstalled toolchains, so reclaim the space we do not need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk \
                      /opt/ghc /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-

      - name: Build with Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          BOA_VERSION: ${{ env.BOA_VERSION }}
          BOA_BUILD_NUMBER: ${{ github.run_number }}
          BOA_DEV_BUILD: ${{ inputs.development_build && '1' || '0' }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android
          buildMethod: BattleOfAgents.EditorTools.BuildScript.BuildAndroid
          allowDirtyBuild: true
          androidExportType: androidPackage
          versioning: None          # BuildScript sets the version from BOA_VERSION
          # No keystore inputs: the APK is signed with Unity's debug key, which is
          # what you want for sideloading. Play Store uploads need a release key.

      - name: Locate the APK
        id: apk
        run: |
          set -euo pipefail
          APK="$(find build -name '*.apk' -print -quit)"
          if [ -z "$APK" ]; then echo "::error::no APK produced"; exit 1; fi
          sudo chown "$USER" "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c%s "$APK")" >> "$GITHUB_OUTPUT"

      - name: Verify alignment and signature
        continue-on-error: true
        run: |
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$BT/zipalign" -c -v 4 "${{ steps.apk.outputs.path }}" | tail -3 || true
          "$BT/apksigner" verify --print-certs "${{ steps.apk.outputs.path }}" || true

      # A signed APK is already a zip, so re-deflating it would break the signing
      # block. Instead we wrap it in a maximally compressed archive for download —
      # the APK inside stays byte-identical and installable.
      - name: Package a max-compressed zip
        id: zip
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
          NAME="BattleOfAgents-${{ env.BOA_VERSION }}-${{ github.run_number }}"
          mkdir -p dist
          cp "${{ steps.apk.outputs.path }}" "dist/$NAME.apk"
          cd dist
          7z a -tzip -mx=9 -mfb=258 -mpass=15 -mmt=on "$NAME.zip" "$NAME.apk"
          echo "zip_bytes=$(stat -c%s "$NAME.zip")" >> "$GITHUB_OUTPUT"

      - name: Size report
        run: |
          apk=${{ steps.apk.outputs.bytes }}
          zip=${{ steps.zip.outputs.zip_bytes }}
          {
            echo "### Battle of Agents — build ${{ github.run_number }}"
            echo ""
            echo "| artefact | size |"
            echo "| --- | ---: |"
            printf "| APK | %.2f MB |\n" "$(echo "$apk/1048576" | bc -l)"
            printf "| ZIP (7z -mx=9) | %.2f MB |\n" "$(echo "$zip/1048576" | bc -l)"
            printf "| saved by zip | %.1f%% |\n" "$(echo "100-($zip*100/$apk)" | bc -l)"
            echo ""
            echo "IL2CPP · ARM64 · engine code stripped · managed stripping High · LZ4HC · ASTC"
            echo "Signed with Unity's debug key — enable \"install unknown apps\" to sideload."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BattleOfAgents-apk-${{ github.run_number }}
          path: dist/*.zip
          compression-level: 0   # already compressed by 7z
          retention-days: 30

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
