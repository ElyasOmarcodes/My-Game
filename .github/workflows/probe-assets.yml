name: Probe CC0 assets

# Reconnaissance for the CC0 model packs: lists the model files inside the
# candidate repositories and prints their licence text, so the build can pin
# exact paths and the credits file can name the right authors.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Inspect candidate packs
        run: |
          repos=(
            "KayKit-Game-Assets/KayKit-City-Builder-Bits-1.0"
            "KayKit-Game-Assets/KayKit-Character-Pack-Adventures-1.0"
            "sketchpunklabs/kaykit_char"
            "Malcolmnixon/Quaternius-Modular-Scifi-Pack"
            "BoQsc/cc0-guns-explosives-pack-glb"
            "KenneyNL/KayKit-Hexagons"
          )

          for repo in "${repos[@]}"; do
            echo "=============================================================="
            echo "REPO: $repo"

            meta=$(curl -sS --max-time 30 "https://api.github.com/repos/$repo")
            branch=$(echo "$meta" | jq -r '.default_branch // "main"')
            echo "  default branch: $branch   size: $(echo "$meta" | jq -r '.size') KB"
            echo "  licence field:  $(echo "$meta" | jq -r '.license.spdx_id // "none"')"

            echo "  --- licence file (first 6 lines)"
            curl -sS --max-time 30 "https://api.github.com/repos/$repo/license" \
              | jq -r '.content // ""' | base64 -d 2>/dev/null | head -6 | sed 's/^/    /' \
              || echo "    (no licence file)"

            echo "  --- model files"
            curl -sS --max-time 60 "https://api.github.com/repos/$repo/git/trees/$branch?recursive=1" \
              | jq -r '.tree[]? | select(.path | test("\\.(glb|gltf|fbx|obj)$"; "i")) | "    \(.path)  \(.size)"' \
              | head -45
            echo "  --- model file count by type"
            curl -sS --max-time 60 "https://api.github.com/repos/$repo/git/trees/$branch?recursive=1" \
              | jq -r '.tree[]? | .path' | grep -oiE '\.(glb|gltf|fbx|obj|png)$' | sort | uniq -c | sed 's/^/    /'
          done

      - name: Godot release assets available
        run: |
          echo "--- godot 4.3-stable release files"
          curl -sS --max-time 30 "https://api.github.com/repos/godotengine/godot/releases/tags/4.3-stable" \
            | jq -r '.assets[]? | "\(.name)  \(.size)"' | grep -Ei 'linux|template' | head -20
