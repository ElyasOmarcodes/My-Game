name: Probe CC0 assets

# Reconnaissance only. Lists the Kenney pack folders in the community mirror so
# the build can sparse-checkout exactly the three kits the game needs.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Kenney mirror — pack folders
        run: |
          set -euo pipefail
          # Blobless + no checkout: fetches the tree listing, not the 280 MB of files.
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/ETdoFresh/kenney.nl.git mirror
          cd mirror

          echo "=== top level ==="
          git ls-tree --name-only HEAD | head -40

          echo "=== folders matching what we need ==="
          git ls-tree -r --name-only HEAD \
            | grep -oiE '^[^/]+/[^/]*(city|blaster|character|weapon|road|survival|nature)[^/]*' \
            | cut -d/ -f1-2 | sort -u | head -40

          echo "=== every 3D pack directory (depth 2) ==="
          git ls-tree -r --name-only HEAD | cut -d/ -f1-2 | sort -u | head -80

      - name: Kenney mirror — inside the kits we want
        run: |
          set -euo pipefail
          cd mirror
          for needle in "City Kit" "Blaster" "Blocky Characters" "Mini Characters" "Weapon"; do
            echo "=============================================="
            echo "### $needle"
            git ls-tree -r --name-only HEAD \
              | grep -i "$needle" \
              | grep -iE '\.(glb|gltf|fbx|obj)$' \
              | head -30
            echo "--- count:"
            git ls-tree -r --name-only HEAD | grep -i "$needle" | grep -icE '\.(glb|gltf|fbx|obj)$' || true
          done

      - name: KayKit city kit — the gltf folder in full
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/KayKit-Game-Assets/KayKit-City-Builder-Bits-1.0.git kaykit
          cd kaykit
          echo "=== gltf models ==="
          git ls-tree -r --name-only HEAD | grep -iE 'gltf.*\.(gltf|glb|bin)$' | head -60
          echo "=== licence ==="
          git ls-tree -r --name-only HEAD | grep -iE 'licen|readme' | head
