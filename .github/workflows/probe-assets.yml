name: Probe CC0 assets

# Reconnaissance for the CC0 model packs. The sandbox this project is developed
# in cannot reach anything outside its own repository, so the exact download
# URLs have to be discovered on a runner and pinned afterwards.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Which hosts answer at all
        run: |
          {
            echo "## Reachability"
            echo '```'
            for host in kenney.nl github.com api.github.com poly.pizza \
                        opengameart.org quaternius.com kaylousberg.itch.io; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "https://$host/" || echo FAIL)
              echo "$host -> $code"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kenney's GitHub account
        run: |
          {
            echo "## github.com/KenneyNL repositories"
            echo '```'
            curl -sS --max-time 30 'https://api.github.com/users/KenneyNL/repos?per_page=100' \
              | jq -r '.[]? | "\(.full_name)  (\(.size) KB)"' | head -60 || echo "(query failed)"
            echo '```'

            echo "## Search: kenney assets"
            echo '```'
            curl -sS --max-time 30 'https://api.github.com/search/repositories?q=kenney+assets&per_page=15' \
              | jq -r '.items[]? | "\(.full_name)  \(.size) KB  \(.description // "")"' || echo "(query failed)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Kenney asset pages and their download links
        run: |
          {
            echo "## kenney.nl download links"
            echo '```'
            for slug in city-kit-commercial city-kit-suburban city-kit-roads \
                        blaster-kit blocky-characters mini-characters-1 \
                        weapon-pack survival-kit; do
              echo "--- $slug"
              curl -sSL --max-time 30 "https://kenney.nl/assets/$slug" \
                | grep -oE 'href="[^"]*\.zip"' | sort -u | head -5 || echo "  (no zip link found)"
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Other CC0 sources worth pinning
        run: |
          {
            echo "## Kay Lousberg / Quaternius style kits on GitHub"
            echo '```'
            for q in "kaykit" "quaternius" "cc0 3d models glb"; do
              echo "--- search: $q"
              curl -sS --max-time 30 "https://api.github.com/search/repositories?q=$(echo "$q" | tr ' ' '+')&per_page=8" \
                | jq -r '.items[]? | "\(.full_name)  \(.size) KB  \(.license.spdx_id // "no-license")"' || true
            done
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
