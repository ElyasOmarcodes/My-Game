name: Probe CC0 assets

# Reconnaissance only: which Kenney packs in the mirror contain 3D models.
# Deliberately tiny output so it survives log tailing.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: List every pack that ships GLB models
        run: |
          set -eu
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/ETdoFresh/kenney.nl.git mirror
          cd mirror
          git ls-tree -r --name-only HEAD > /tmp/all.txt

          echo "### packs containing .glb"
          grep -iE '\.glb$' /tmp/all.txt | cut -d/ -f1 | sort | uniq -c | sort -rn
